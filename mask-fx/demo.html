<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   1. The numbers. UE camera space: X forward, Y right, Z up; centimetres; degrees
      (FRotator Pitch, Yaw, Roll). The hand's pivot is the centre of the palm; each
      mask's pivot is the centre of its bounding box. Mask 0 = Don Giovanni,
      1 = Donna Anna, 2 = Leporello.
   ===================================================================== */
const SPEC = {
  masks: ['Don Giovanni', 'Donna Anna', 'Leporello'],
  poses_cm: {                       // where the palm is
    start: [42, 22, -44],           // below the screen, right: the put starts here
    show: [33, 2.5, -13],           // in front of the chest: the mask is shown and turned
    face: [8.5, 0, -10],            // the mask is on the face
    rest: [30, 20, -55],            // below the screen, right: the put ends and the take starts here
    take_end: [45, 26, -50],        // below the screen, right: the take ends here
  },
  mask_offset_cm: [1.2, 0, 11.5],   // mask pivot = palm + this offset (in camera space, not turned with the hand)
  mask_tilt: 0.6,                   // the mask follows 60 % of the hand's pitch and roll
  turn_from: 0.35,                  // put_rise: the mask turns from its face to its inside once k passes this
  phases: {
    put_rise:   { seconds: 0.50, ease: 'cubic_in_out', from: 'start', to: 'show',     pitch: [-40.11, 0], roll: [-20.05, 0], mask_shown: true },
    put_press:  { seconds: 0.30, ease: 'quad_in',      from: 'show',  to: 'face',     pitch: [0, 0],      roll: [0, 0],      mask_shown: true },
    put_drop:   { seconds: 0.35, ease: 'cubic_in_out', from: 'face',  to: 'rest',     pitch: [0, 28.65],  roll: [0, 17.19],  mask_shown: false },
    take_reach: { seconds: 0.28, ease: 'cubic_in_out', from: 'rest',  to: 'face',     pitch: [28.65, 0],  roll: [17.19, 0],  mask_shown: false },
    take_pull:  { seconds: 0.45, ease: 'cubic_in_out', from: 'face',  to: 'take_end', pitch: [0, -34.38], roll: [0, -17.19], mask_shown: true },
  },
  scene_cue_seconds: 0.42,          // after put_rise starts: when the greybox starts moving the scenery
  blink: { color_srgb: '#0d0907', max_alpha: 0.92, ramp_seconds: 0.30, release_seconds: 0.14, fade_seconds: 0.23 },
  vignette: { fade_seconds: 0.9 },
  sound: { base_hz: 293.66, semitones: [[0, 4, 7, 12], [0, 3, 7, 3], [0, 3, 6, 9]], note_gap_seconds: 0.16, note_seconds: 0.9, note_gain: 0.07, wave: 'triangle' },
};
const HAND_COLOR = 0x231d1a;   // sRGB
const MASK_FILE = ['Don', 'Anna', 'Leporello'];

/* =====================================================================
   2. Easing
   ===================================================================== */
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, k) => a + (b - a) * k;
const lerp3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const EASE = {
  cubic_in_out: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  quad_in: (t) => t * t,
};
/** CSS "ease", cubic-bezier(0.25, 0.1, 0.25, 1.0): the greybox's blink and vignette fades. */
function cssEase(x) {
  x = clamp01(x);
  const X1 = 0.25, Y1 = 0.1, X2 = 0.25, Y2 = 1.0;
  const bx = (t) => 3 * (1 - t) * (1 - t) * t * X1 + 3 * (1 - t) * t * t * X2 + t * t * t;
  const dbx = (t) => 3 * (1 - t) * (1 - t) * X1 + 6 * (1 - t) * t * (X2 - X1) + 3 * t * t * (1 - X2);
  let t = x;
  for (let i = 0; i < 8; i++) t = clamp01(t - (bx(t) - x) / Math.max(dbx(t), 1e-6));
  return 3 * (1 - t) * (1 - t) * t * Y1 + 3 * (1 - t) * t * t * Y2 + t * t * t;
}

/* =====================================================================
   3. The pose of the hand and the mask at progress u (0..1) of a phase, in UE camera space
   ===================================================================== */
function phasePose(name, u) {
  const ph = SPEC.phases[name], k = EASE[ph.ease](clamp01(u));
  const pos = lerp3(SPEC.poses_cm[ph.from], SPEC.poses_cm[ph.to], k);
  const hand = { pos, pitch: lerp(ph.pitch[0], ph.pitch[1], k), yaw: 0, roll: lerp(ph.roll[0], ph.roll[1], k) };
  const turn = name === 'put_rise' ? clamp01((k - SPEC.turn_from) / (1 - SPEC.turn_from)) : 1;
  const o = SPEC.mask_offset_cm;
  // The mask's three turns are applied one after another, NOT as one FRotator:
  // first roll, then the turn (yaw), then pitch, each about the camera's axes.
  const mask = { shown: ph.mask_shown, pos: [pos[0] + o[0], pos[1] + o[1], pos[2] + o[2]],
    pitch: SPEC.mask_tilt * hand.pitch, yaw: -180 * (1 - turn), roll: SPEC.mask_tilt * hand.roll, turn };
  return { k, hand, mask };
}
/** The mask's rotation: roll, then yaw, then pitch (in UE: FQuat(Pitch) * FQuat(Yaw) * FQuat(Roll)). */
function maskQuat(m, out = new THREE.Quaternion()) {
  const qp = ueToThreeQuat(m.pitch, 0, 0), qy = ueToThreeQuat(0, m.yaw, 0), qr = ueToThreeQuat(0, 0, m.roll);
  return out.copy(qp).multiply(qy).multiply(qr);
}

/** A value that eases towards a target; the time scales with the distance (like an interrupted CSS transition). */
class Fade {
  constructor() { this.alpha = 0; this.from = 0; this.to = 0; this.time = 0; this.duration = 0; }
  start(target, fullSeconds) { this.from = this.alpha; this.to = target; this.time = 0; this.duration = Math.max(1e-4, fullSeconds * Math.abs(target - this.alpha)); }
  update(dt) {
    if (this.alpha === this.to) return;
    this.time += dt;
    const k = this.time / this.duration;
    this.alpha = k >= 1 ? this.to : lerp(this.from, this.to, cssEase(k));
  }
}

/** Screen darkening at the press: rises along "ease" towards max_alpha, lets go at release_seconds, fades out. */
function blinkAlpha(t) {
  const B = SPEC.blink;
  if (t < 0) return 0;
  const peak = B.max_alpha * cssEase(Math.min(t, B.release_seconds) / B.ramp_seconds);
  if (t <= B.release_seconds) return peak;
  const u = (t - B.release_seconds) / B.fade_seconds;
  return u >= 1 ? 0 : peak * (1 - cssEase(u));
}

/* =====================================================================
   4. The state machine (UDGMaskFXComponent does the same)
   ===================================================================== */
class MaskFX {
  constructor(hooks = {}) {
    this.hooks = hooks;
    this.queue = []; this.phase = null; this.phaseMask = -1; this.time = 0;
    this.putClock = -1; this.cueSent = false;
    this.worn = -1;                                   // the mask on the face, -1 = none
    this.vignette = [new Fade(), new Fade(), new Fade()];
    this.blinkTime = -1;
  }
  get busy() { return !!this.phase || this.queue.length > 0; }
  /** Put mask i on; another mask on the face comes off first. False if ignored. */
  wear(i) {
    if (this.busy || i === this.worn || !(i >= 0 && i < 3)) return false;
    if (this.worn >= 0) this.queue.push(['take_reach', this.worn], ['take_pull', this.worn]);
    this.queue.push(['put_rise', i], ['put_press', i], ['put_drop', i]);
    this.#emit('wearRequested', i);               // already busy here, so a listener cannot start another one
    this.#next();
    return true;
  }
  /** Take the worn mask off. False if ignored. */
  remove() {
    if (this.busy || this.worn < 0) return false;
    this.queue.push(['take_reach', this.worn], ['take_pull', this.worn]);
    this.#next();
    return true;
  }
  update(dt) {
    let left = dt;
    while (this.phase) {
      const dur = SPEC.phases[this.phase].seconds, step = Math.max(0, Math.min(left, dur - this.time));
      this.time += step; left -= step;
      if (this.putClock >= 0) {
        this.putClock += step;
        if (!this.cueSent && this.putClock >= SPEC.scene_cue_seconds) { this.cueSent = true; this.#emit('sceneCue', this.phaseMask); }
      }
      if (this.time >= dur) this.#finish(); else break;
    }
    for (const f of this.vignette) f.update(dt);
    if (this.blinkTime >= 0) {
      this.blinkTime += dt;
      if (this.blinkTime > SPEC.blink.release_seconds + SPEC.blink.fade_seconds) this.blinkTime = -1;
    }
  }
  pose() { return this.phase ? phasePose(this.phase, this.time / SPEC.phases[this.phase].seconds) : null; }
  get blink() { return blinkAlpha(this.blinkTime); }
  #next() {
    const nx = this.queue.shift();
    if (!nx) { this.phase = null; this.phaseMask = -1; this.time = 0; return; }
    [this.phase, this.phaseMask] = nx; this.time = 0;
    if (this.phase === 'put_rise') { this.putClock = 0; this.cueSent = false; this.#emit('putStarted', this.phaseMask); }
    if (this.phase === 'take_reach') this.#emit('takeStarted', this.phaseMask);
  }
  #finish() {
    const done = this.phase, m = this.phaseMask;
    if (done === 'put_press') { this.worn = m; this.blinkTime = 0; this.vignette[m].start(1, SPEC.vignette.fade_seconds); this.#emit('maskOn', m); }
    if (done === 'take_reach') { this.worn = -1; this.vignette[m].start(0, SPEC.vignette.fade_seconds); this.#emit('maskOff', m); }
    if (done === 'put_drop') this.putClock = -1;
    this.phase = null;                             // over; busy stays true while more phases are queued (a swap)
    if (done === 'put_drop') this.#emit('putFinished', m);
    if (done === 'take_pull') this.#emit('takeFinished', m);
    if (!this.phase) this.#next();                 // unless a listener has already started a new one
  }
  #emit(name, m) { this.hooks[name]?.(m); }
}

/* =====================================================================
   5. UE camera space -> three.js camera space (x right, y up, -z forward, metres)
   ===================================================================== */
const ueToThreePos = (p, out = new THREE.Vector3()) => out.set(p[1] / 100, p[2] / 100, -p[0] / 100);
const D2R = Math.PI / 180;
/** UE FRotator (degrees) -> three.js quaternion, through UE's own rotation matrix (FRotationMatrix). */
function ueToThreeQuat(pitch, yaw, roll, out = new THREE.Quaternion()) {
  const SP = Math.sin(pitch * D2R), CP = Math.cos(pitch * D2R), SY = Math.sin(yaw * D2R), CY = Math.cos(yaw * D2R), SR = Math.sin(roll * D2R), CR = Math.cos(roll * D2R);
  // Where UE's X, Y and Z axes end up (UE coordinates): the rows of FRotationMatrix.
  const ux = [CP * CY, CP * SY, SP];
  const uy = [SR * SP * CY - CR * SY, SR * SP * SY + CR * CY, -SR * CP];
  const uz = [-(CR * SP * CY + SR * SY), CY * SR - CR * SP * SY, CR * CP];
  const T = (v) => new THREE.Vector3(v[1], v[2], -v[0]);            // UE direction -> three.js direction
  // three.js +x is UE +Y, +y is UE +Z, +z is UE -X.
  return out.setFromRotationMatrix(new THREE.Matrix4().makeBasis(T(uy), T(uz), T(ux).negate()));
}

/* =====================================================================
   6. Scene: a small stage in the greybox's neutral palette, the hand and the masks
   ===================================================================== */
const CAPTURE = new URLSearchParams(location.search).has('capture');
if (CAPTURE) document.body.classList.add('capture');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8b8781);
scene.fog = new THREE.FogExp2(0x8b8781, 0.045);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.01, 200);   // same as the greybox
camera.position.set(0, 1.65, 0); scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdedad2, 0x3a3433, 1.15));
const key = new THREE.DirectionalLight(0xfff4e4, 1.5); key.position.set(-6, 10, 4); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 }); key.shadow.mapSize.set(2048, 2048);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfc8d8, 0.35); fill.position.set(8, 6, -6); scene.add(fill);

function buildStage() {
  const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, flatShading: true, ...extra });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x6b6864, roughness: 0.5 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const put = (geo, mat, x, z, { y = 0, ry = 0, rz = 0 } = {}) => {
    geo.computeBoundingBox(); const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y - geo.boundingBox.min.y, z); m.rotation.set(0, ry, rz); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
  };
  const green = M(0x5a8c3c), plum = M(0x2c1f30), marble = M(0x8a8a8a, { roughness: 0.45 }), orb = M(0x141414, { roughness: 0.22, metalness: 0.15, flatShading: false });
  put(new THREE.CylinderGeometry(1.9, 1.9, 9.6, 3), green, -5.5, -9, { ry: 0.3 });              // Jarman's green prism
  put(new THREE.CylinderGeometry(1.5, 1.5, 7.2, 3), green, 7.5, -13, { ry: 1.1, rz: 0.12 });
  put(new THREE.ConeGeometry(1.3, 9, 4), plum, 3.2, -7.5, { ry: 0.5 });                        // spike
  put(new THREE.ConeGeometry(1.0, 6.5, 4), plum, -2.8, -15, { ry: 0.2, rz: -0.18 });
  put(new THREE.BoxGeometry(2.5, 2.5, 2.5), marble, 1.2, -4.6, { ry: 0.6 });                   // marble cube
  put(new THREE.SphereGeometry(0.9, 32, 16), orb, -1.6, -5.2);
  const sail = new THREE.Shape(); sail.moveTo(-5, 0); sail.lineTo(5, 0); sail.lineTo(0, 8.5); sail.lineTo(-5, 0);
  put(new THREE.ExtrudeGeometry(sail, { depth: 0.25, bevelEnabled: false }), plum, -9, -4, { ry: 1.2 });
}
buildStage();

/** The dark first-person hand from the greybox (05_player.js, buildHand): a right hand, palm towards the mask. */
function buildHand(mat = new THREE.MeshStandardMaterial({ color: HAND_COLOR, roughness: 0.75 })) {
  const g = new THREE.Group();
  const palm = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.092, 0.026), mat); g.add(palm);
  [[-0.028, 0.95], [-0.009, 1.05], [0.01, 1.0], [0.028, 0.85]].forEach(([x, len]) => {
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.0085, 0.05 * len, 4, 8), mat);
    f.position.set(x, 0.046 + 0.03 * len, -0.006); f.rotation.x = -0.35; g.add(f);
  });
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.0095, 0.04, 4, 8), mat);
  thumb.position.set(-0.046, 0.012, -0.012); thumb.rotation.z = 0.9; thumb.rotation.x = -0.4; g.add(thumb);
  const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.034, 0.12, 12), mat); wrist.position.y = -0.1; g.add(wrist);
  return g;
}
const rig = new THREE.Group(); camera.add(rig);
const hand = buildHand(); hand.visible = false; rig.add(hand);
const maskHolders = [];   // holder: posed from SPEC; inside it the model, turned so that rotation 0 = worn (inside towards us)

async function loadMasks() {
  const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
  for (let i = 0; i < 3; i++) {
    const holder = new THREE.Group(); holder.visible = false; rig.add(holder); maskHolders.push(holder);
    const url = window.MASKFX_ASSETS?.mask?.[i]; if (!url) continue;
    const gltf = await loader.parseAsync(await (await fetch(url)).arrayBuffer(), '');
    const model = gltf.scene, c = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
    model.position.sub(c);                                   // pivot at the centre of the bounding box
    const turned = new THREE.Group(); turned.rotation.y = Math.PI; turned.add(model);   // the face points away from us
    holder.add(turned);
  }
}

/* =====================================================================
   7. Screen layers, sound, driving it all
   ===================================================================== */
const vigEls = [...document.querySelectorAll('#vig .v')];
vigEls.forEach((el, i) => { el.style.backgroundImage = `url(${window.MASKFX_ASSETS?.vignette?.[i] || ''})`; });
const blinkEl = document.getElementById('blink');

let audio = null;
function playMotif(ctx, dest, i, at) {
  const S = SPEC.sound;
  S.semitones[i].forEach((s, n) => {
    const t = at + n * S.note_gap_seconds, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = S.wave; o.frequency.value = S.base_hz * Math.pow(2, s / 12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(S.note_gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + S.note_seconds);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + S.note_seconds + 0.05);
  });
}
function motifNow(i) {
  if (CAPTURE) return;
  try {
    if (!audio) { audio = new AudioContext(); audio.master = audio.createGain(); audio.master.gain.value = 0.6; audio.master.connect(audio.destination); }
    audio.resume(); playMotif(audio, audio.master, i, audio.currentTime + 0.01);
  } catch { /* no audio: fine */ }
}

const log = [];
const fx = new MaskFX({
  wearRequested: (m) => { motifNow(m); log.push(['wearRequested', m]); },
  putStarted: (m) => log.push(['putStarted', m]),
  sceneCue: (m) => log.push(['sceneCue', m]),
  maskOn: (m) => log.push(['maskOn', m]),
  putFinished: (m) => log.push(['putFinished', m]),
  takeStarted: (m) => log.push(['takeStarted', m]),
  maskOff: (m) => log.push(['maskOff', m]),
  takeFinished: (m) => log.push(['takeFinished', m]),
});

const tmpQ = new THREE.Quaternion();
function applyPose() {
  const p = fx.pose();
  hand.visible = !!p;
  maskHolders.forEach((h, i) => { h.visible = !!p && p.mask.shown && i === fx.phaseMask; });
  if (p) {
    ueToThreePos(p.hand.pos, hand.position); hand.quaternion.copy(ueToThreeQuat(p.hand.pitch, p.hand.yaw, p.hand.roll, tmpQ));
    const h = maskHolders[fx.phaseMask];
    if (h) { ueToThreePos(p.mask.pos, h.position); maskQuat(p.mask, h.quaternion); }
  }
  vigEls.forEach((el, i) => { el.style.opacity = fx.vignette[i].alpha.toFixed(4); });
  blinkEl.style.opacity = fx.blink.toFixed(4);
}

let yaw = 0, pitch = 0;
function setView(yawDeg, pitchDeg) { yaw = yawDeg * D2R; pitch = pitchDeg * D2R; camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
setView(0, -4);

const stateEl = document.getElementById('state');
const NAMES = ['唐璜', '安娜', '仆从'];
function showState() {
  const ph = fx.phase ? `${fx.phase.padEnd(10)} ${fx.time.toFixed(2)} / ${SPEC.phases[fx.phase].seconds.toFixed(2)} s` : 'idle';
  stateEl.textContent = `状态    ${ph}\n脸上    ${fx.worn >= 0 ? NAMES[fx.worn] : '无'}\n暗框    ${fx.vignette.map((f) => f.alpha.toFixed(2)).join('  ')}\n闪暗    ${fx.blink.toFixed(2)}`;
  document.querySelectorAll('[data-wear]').forEach((b) => { b.classList.toggle('on', +b.dataset.wear === fx.worn); b.disabled = fx.busy; });
  document.getElementById('take').disabled = fx.busy || fx.worn < 0;
  document.querySelectorAll('[data-speed]').forEach((b) => b.classList.toggle('on', +b.dataset.speed === speed));
}

let speed = 1, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!CAPTURE) fx.update(dt * speed);
  applyPose(); renderer.render(scene, camera); if (!CAPTURE) showState();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Digit1') fx.wear(0);
  if (e.code === 'Digit2') fx.wear(1);
  if (e.code === 'Digit3') fx.wear(2);
  if (e.code === 'KeyR') fx.remove();
  if (e.code === 'Space') { speed = speed === 1 ? 0.25 : 1; e.preventDefault(); }
});
const canvas = renderer.domElement;
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) { fx.remove(); return; }
  if (e.button === 0 && document.pointerLockElement !== canvas) canvas.requestPointerLock?.();
});
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0022; pitch = Math.max(-1.35, Math.min(1.35, pitch - e.movementY * 0.0022));
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
});
document.querySelectorAll('[data-wear]').forEach((b) => b.addEventListener('click', () => fx.wear(+b.dataset.wear)));
document.getElementById('take').addEventListener('click', () => fx.remove());
document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => { speed = +b.dataset.speed; }));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =====================================================================
   8. Files for UE: the hand mesh, the motifs as WAV, the numbers as JSON
   ===================================================================== */
/** The hand as one mesh. Turned so that UE's glTF import ((x, y, z) -> (x, z, y)) gives UE camera space at rotation 0. */
async function exportHandGLB() {
  const h = buildHand(); h.updateMatrixWorld(true);
  const parts = [];
  h.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    g.clearGroups(); parts.push(g);
  });
  const merged = mergeGeometries(parts, false);
  merged.applyMatrix4(new THREE.Matrix4().makeRotationY(-Math.PI / 2));   // (x, y, z) -> (-z, y, x)
  const mat = new THREE.MeshStandardMaterial({ color: HAND_COLOR, roughness: 0.75, metalness: 0 }); mat.name = 'M_DG_Hand';
  const mesh = new THREE.Mesh(merged, mat); mesh.name = 'SM_DG_Hand';
  return new GLTFExporter().parseAsync(mesh, { binary: true });
}
/** One mask's motif (the greybox's Sound.motif), mono 16-bit WAV, peak normalised to -6 dBFS. */
async function renderMotifWAV(i, sampleRate = 48000) {
  const S = SPEC.sound, seconds = (S.semitones[i].length - 1) * S.note_gap_seconds + S.note_seconds + 0.12;
  const ctx = new OfflineAudioContext(1, Math.ceil(seconds * sampleRate), sampleRate);
  playMotif(ctx, ctx.destination, i, 0);
  const data = (await ctx.startRendering()).getChannelData(0);
  let peak = 0; for (const s of data) peak = Math.max(peak, Math.abs(s));
  const gain = peak > 0 ? 0.5 / peak : 1, buf = new ArrayBuffer(44 + data.length * 2), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, data.length * 2, true);
  data.forEach((s, k) => v.setInt16(44 + k * 2, Math.max(-32768, Math.min(32767, Math.round(s * gain * 32767))), true));
  return buf;
}
function specJSON() {
  return {
    about: 'Mask on / mask off for a first-person camera, taken out of the Don Giovanni greybox. demo.html and UDGMaskFXComponent use exactly these numbers.',
    space: 'UE camera space: X forward, Y right, Z up. Centimetres. Rotations are FRotator (Pitch, Yaw, Roll) in degrees. The hand pivot is the centre of the palm; each mask pivot is the centre of its bounding box.',
    mask_order: SPEC.masks,
    poses_cm: SPEC.poses_cm,
    mask_offset_cm: SPEC.mask_offset_cm,
    mask_tilt: SPEC.mask_tilt,
    turn_from: SPEC.turn_from,
    phases: SPEC.phases,
    how_to_pose: {
      progress: 'k = ease(time in phase / seconds)',
      hand: 'location = lerp(poses_cm[from], poses_cm[to], k); rotation = FRotator(lerp(pitch), 0, lerp(roll))',
      mask: 'location = hand location + mask_offset_cm (the offset is not turned with the hand); hidden when mask_shown is false',
      mask_rotation: 'three single turns applied one after another about the camera axes: first roll = mask_tilt * hand roll, then yaw = -180 * (1 - turn), then pitch = mask_tilt * hand pitch. In UE: FQuat(FRotator(pitch, 0, 0)) * FQuat(FRotator(0, yaw, 0)) * FQuat(FRotator(0, 0, roll)). A single FRotator(pitch, yaw, roll) is NOT the same: while the mask shows its face it would lean the wrong way (up to 48 degrees off).',
      turn: 'put_rise: clamp((k - turn_from) / (1 - turn_from), 0, 1); every other phase: 1. turn 0 shows the face of the mask to the player, 1 its inside.',
    },
    sequences: {
      wear: ['put_rise', 'put_press', 'put_drop'],
      remove: ['take_reach', 'take_pull'],
      swap: ['take_reach (old mask)', 'take_pull (old mask)', 'put_rise (new mask)', 'put_press (new mask)', 'put_drop (new mask)'],
      input: 'Ignored while any phase runs. Asking for the mask already on the face does nothing.',
    },
    events: {
      wear_requested: 'the wear is accepted (the greybox plays the mask motif here)',
      put_started: 'put_rise starts',
      scene_cue: 'scene_cue_seconds after put_rise starts (the greybox starts moving the scenery here)',
      mask_on: 'end of put_press: the mask hides, the blink starts, the vignette fades in',
      put_finished: 'end of put_drop',
      take_started: 'take_reach starts (the greybox puts the scenery back here)',
      mask_off: 'end of take_reach: the mask shows, the vignette fades out',
      take_finished: 'end of take_pull',
    },
    scene_cue_seconds: SPEC.scene_cue_seconds,
    blink: { ...SPEC.blink, formula: 'peak = max_alpha * css_ease(min(t, release_seconds) / ramp_seconds); t <= release_seconds: alpha = peak; after: alpha = peak * (1 - css_ease((t - release_seconds) / fade_seconds))' },
    vignette: { ...SPEC.vignette, image: 'full-screen RGBA texture stretched to the screen, one per mask (T_DG_Vignette_*)', formula: 'on change: from = current alpha, duration = fade_seconds * |target - from|, alpha = lerp(from, target, css_ease(t / duration))' },
    easing: { cubic_in_out: 'k < 0.5 ? 4k^3 : 1 - (-2k + 2)^3 / 2', quad_in: 'k^2', css_ease: 'cubic-bezier(0.25, 0.1, 0.25, 1.0)' },
    camera: { greybox_vertical_fov_deg: 66, greybox_horizontal_fov_deg_16_9: 98.2, greybox_near_clip_cm: 1, ue_default_horizontal_fov_deg: 90, ue_default_near_clip_cm: 10 },
    sound: { ...SPEC.sound, files: MASK_FILE.map((n) => `SFX_DG_MaskMotif_${n}.wav`), note: 'note_gain is before the greybox master gain 0.6; the WAV files are normalised to a -6 dBFS peak' },
  };
}
function download(name, data, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
document.getElementById('export').addEventListener('click', async () => {
  download('SM_DG_Hand.glb', await exportHandGLB(), 'model/gltf-binary');
  download('mask_fx.json', JSON.stringify(specJSON(), null, 2) + '\n', 'application/json');
  for (let i = 0; i < 3; i++) download(`SFX_DG_MaskMotif_${MASK_FILE[i]}.wav`, await renderMotifWAV(i), 'audio/wav');
});

/* ---------- start ---------- */
window.MFX = { SPEC, fx, log, phasePose, maskQuat, blinkAlpha, cssEase, ueToThreePos, ueToThreeQuat, exportHandGLB, renderMotifWAV, specJSON, setView, THREE, hand, maskHolders, camera,
  advance(dt, steps = 1) { for (let i = 0; i < steps; i++) fx.update(dt / steps); applyPose(); },
  render() { applyPose(); renderer.render(scene, camera); }, ready: false };
try {
  await loadMasks();
} catch (e) {
  const err = document.getElementById('err'); err.style.display = 'flex';
  err.textContent = '面具加载失败：' + e.message + '。请确认 demo_assets.js 和本页在同一个文件夹，并且能联网（three.js 从 jsDelivr 加载）。';
}
window.MFX.ready = true;
requestAnimationFrame(frame);
</script>
