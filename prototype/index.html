const D2R = Math.PI / 180;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/** Pause-aware game clock: wait(seconds) and until(predicate) resolve inside the frame loop. */
class Scheduler {
  constructor() { this.time = 0; this.waiters = []; }
  wait(seconds) { const at = this.time + seconds; return new Promise((res) => this.waiters.push({ at, res })); }
  until(pred) { return new Promise((res) => this.waiters.push({ pred, res })); }
  tick(dt) {
    this.time += dt;
    const keep = [];
    for (const w of this.waiters) {
      const done = w.pred ? w.pred() : this.time >= w.at;
      if (done) w.res(); else keep.push(w);
    }
    this.waiters = keep;
  }
}

/** Frame-driven tweens. run(duration, fn) calls fn(easedK) every frame and resolves at the end. */
class Tweens {
  constructor() { this.list = []; }
  run(duration, fn, easing = easeInOut) {
    return new Promise((res) => { const t = { k: 0, duration: Math.max(1e-3, duration), fn, easing, res }; this.list.push(t); fn(easing(0)); });
  }
  update(dt) {
    const keep = [];
    for (const t of this.list) {
      t.k = Math.min(1, t.k + dt / t.duration);
      t.fn(t.easing(t.k));
      if (t.k >= 1) t.res(); else keep.push(t);
    }
    this.list = keep;
  }
}

/* =====================================================================

function canvasTexture(w, h, draw, { srgb = true, repeat = null } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.userData.canvas = c;
  return t;
}

function drawMarble(g, w, h, rnd) {
  g.fillStyle = '#121212'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * w, y = rnd() * h, r = 2 + rnd() * 20, c = 34 + rnd() * 34;
    g.fillStyle = `rgba(${c | 0},${c | 0},${(c + 3) | 0},${0.05 + rnd() * 0.08})`;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.lineCap = 'round';
  for (let v = 0; v < 30; v++) {
    let x = rnd() * w, y = rnd() * h, a = rnd() * Math.PI * 2;
    const len = 120 + rnd() * 520;
    g.strokeStyle = `rgba(236,236,232,${0.3 + rnd() * 0.55})`; g.lineWidth = 0.6 + rnd() * 2.6;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < len; s += 6) { a += (rnd() - 0.5) * 0.7; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
    g.stroke();
  }
  g.filter = 'blur(7px)';
  for (let i = 0; i < 16; i++) {
    g.fillStyle = `rgba(230,230,226,${0.06 + rnd() * 0.12})`;
    g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 20 + rnd() * 70, 8 + rnd() * 30, rnd() * 3, 0, 7); g.fill();
  }
  g.filter = 'none';
}

function drawHalo(g, w, h) {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.75)');
  gr.addColorStop(0.7, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

function drawCracks(g, w, h, rnd, { centres, color, count = 9, len = 0.45, width = 1 }) {
  g.strokeStyle = color; g.lineCap = 'round';
  const branch = (x, y, a, l, lineW, depth) => {
    lineW *= width;
    g.lineWidth = lineW; g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < l; s += 8) {
      a += (rnd() - 0.5) * 0.6; x += Math.cos(a) * 8; y += Math.sin(a) * 8; g.lineTo(x, y);
      if (depth < 2 && rnd() < 0.05) { g.stroke(); branch(x, y, a + (rnd() - 0.5) * 1.6, l * 0.4, lineW / width * 0.6, depth + 1); g.beginPath(); g.moveTo(x, y); g.lineWidth = lineW; }
    }
    g.stroke();
  };
  for (const [cx, cy] of centres) for (let i = 0; i < count; i++) branch(cx * w, cy * h, (i / count) * Math.PI * 2 + rnd() * 0.5, len * w * (0.5 + rnd() * 0.5), 2.5 + rnd() * 2, 0);
}

function drawPose(g, S, spec) {
  g.fillStyle = g.strokeStyle = '#fff'; g.lineCap = g.lineJoin = 'round';
  const P = ([x, y]) => [x * S, y * S];
  const poly = (pts) => { g.beginPath(); pts.forEach((p, i) => { const [X, Y] = P(p); if (i) g.lineTo(X, Y); else g.moveTo(X, Y); }); g.closePath(); g.fill(); };
  const line = (pts, w) => { g.lineWidth = w * S; g.beginPath(); pts.forEach((p, i) => { const [X, Y] = P(p); if (i) g.lineTo(X, Y); else g.moveTo(X, Y); }); g.stroke(); };
  const W = spec.limbW || 0.045;
  if (spec.cloak) poly(spec.cloak);
  if (spec.skirt) poly(spec.skirt);
  poly(spec.torso);
  for (const l of spec.legs || []) line(l, W * 1.1);
  for (const a of spec.arms || []) line(a, W * 0.85);
  if (spec.sword) line(spec.sword, 0.012);
  const [hx, hy] = P(spec.head); const r = (spec.headR || 0.047) * S;
  g.beginPath(); g.arc(hx, hy, r, 0, 7); g.fill();
  // neck
  g.fillRect(hx - r * 0.45, hy, r * 0.9, r * 1.6);
  if (spec.hair) { g.beginPath(); g.arc(hx - r * 0.7, hy - r * 0.5, r * 0.7, 0, 7); g.fill(); }
  if (spec.hat === 'tricorne' || spec.hat === 'feather') {
    g.beginPath(); g.ellipse(hx, hy - r * 0.75, r * 2.0, r * 0.42, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(hx - r * 1.1, hy - r * 0.8); g.lineTo(hx, hy - r * 2.1); g.lineTo(hx + r * 1.1, hy - r * 0.8); g.fill();
    if (spec.hat === 'feather') { g.lineWidth = r * 0.35; g.beginPath(); g.moveTo(hx - r * 0.6, hy - r * 1.5); g.quadraticCurveTo(hx - r * 2.6, hy - r * 3.4, hx - r * 3.2, hy - r * 1.6); g.stroke(); }
  } else if (spec.hat === 'tricorne-front') {
    g.beginPath(); g.ellipse(hx, hy - r * 0.8, r * 2.3, r * 0.5, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(hx - r * 1.2, hy - r * 0.8); g.lineTo(hx, hy - r * 1.9); g.lineTo(hx + r * 1.2, hy - r * 0.8); g.fill();
  } else if (spec.hat === 'cap') {
    g.beginPath(); g.ellipse(hx + r * 0.1, hy - r * 0.55, r * 1.25, r * 0.7, 0, Math.PI, 0); g.fill();
  }
  if (spec.stoop) { g.beginPath(); g.arc(hx - r * 0.2, hy + r * 1.9, r * 0.9, 0, 7); g.fill(); }
}

/** Owns background, fog, the two global lights and the tint of every shared material. */
class Atmosphere {
  constructor(scene, hemi, key) {
    this.scene = scene; this.hemi = hemi; this.key = key;
    this.cur = this.#copy(PALETTE.neutral); this.from = null; this.target = null; this.k = 1; this.duration = 1;
  }
  #copy(p) { const o = {}; for (const k of COLOR_KEYS) o[k] = new THREE.Color(p[k]); for (const k of NUM_KEYS) o[k] = p[k]; return o; }
  #mixInto(out, a, b, t) { for (const k of COLOR_KEYS) out[k].copy(a[k]).lerp(b[k], t); for (const k of NUM_KEYS) out[k] = lerp(a[k], b[k], t); }
  set(name) { this.cur = this.#copy(PALETTE[name]); this.target = null; this.apply(); }
  to(name, duration = 2) { this.from = this.#copy(this.#asObj(this.cur)); this.target = this.#copy(PALETTE[name]); this.k = 0; this.duration = duration; }
  mix(a, b, t) { this.target = null; this.#mixInto(this.cur, this.#copy(PALETTE[a]), this.#copy(PALETTE[b]), clamp01(t)); this.apply(); }
  #asObj(c) { const o = {}; for (const k of COLOR_KEYS) o[k] = c[k].getHex(); for (const k of NUM_KEYS) o[k] = c[k]; return o; }
  snapshot() { return this.#asObj(this.cur); }
  update(dt) {
    if (!this.target) return;
    this.k = Math.min(1, this.k + dt / this.duration);
    this.#mixInto(this.cur, this.from, this.target, easeInOut(this.k));
    if (this.k >= 1) this.target = null;
    this.apply();
  }
  apply() {
    const c = this.cur;
    this.scene.background.copy(c.bg); this.scene.fog.color.copy(c.bg); this.scene.fog.near = c.near; this.scene.fog.far = c.far;
    this.hemi.color.copy(c.sky); this.hemi.groundColor.copy(c.ground); this.hemi.intensity = c.hemi;
    this.key.color.copy(c.key); this.key.intensity = c.keyI;
    MAT.slab.color.copy(c.slab); MAT.prism.color.copy(c.prism); MAT.block.color.copy(c.block); MAT.orb.color.copy(c.orb); MAT.white.color.copy(c.white);
    for (const m of MAT.floors) m.color.copy(c.floor);

}

/* =====================================================================
   4. Morphing: every moving piece has one transform per mask state
   ===================================================================== */
const STATE_NAMES = ['neutral', 'don', 'anna', 'servant'];
function toState(s) {
  return { p: v3(...(s.p || [0, 0, 0])), q: s.q ? s.q.clone() : qDeg(...(s.r || [0, 0, 0])), s: v3(...(s.s || [1, 1, 1])), v: s.v === undefined ? 1 : s.v };
}

/** One moving thing. `states` maps a state name to {p, r (degrees), s, v (0..1 visibility)}. Missing states fall back to neutral. */
class Morphable {
  constructor(id, obj, states, { drift = null, durations = {} } = {}) {
    this.id = id; this.obj = obj; this.drift = drift; this.durations = durations;
    this.states = {};
    const base = states.neutral;
    for (const [name, s] of Object.entries(states)) this.states[name] = toState({ ...base, ...s });
    this.cur = this.#clone(this.states.neutral);
    this.from = this.#clone(this.cur); this.target = this.states.neutral; this.k = 1; this.duration = 1; this.delay = 0;
  }
  #clone(s) { return { p: s.p.clone(), q: s.q.clone(), s: s.s.clone(), v: s.v }; }
  stateFor(name) { return this.states[name] || this.states.neutral; }
  go(name, duration, delay) {
    this.from = this.#clone(this.cur); this.target = this.stateFor(name);
    this.k = 0; this.duration = this.durations[name] ?? duration; this.delay = delay;
  }
  snap(name) { this.target = this.stateFor(name); this.cur = this.#clone(this.target); this.from = this.#clone(this.cur); this.k = 1; }
  update(dt, driftWeight, time) {
    if (this.k < 1) {
      if (this.delay > 0) this.delay -= dt;
      else {
        this.k = Math.min(1, this.k + dt / this.duration);
        const e = easeInOut(this.k);
        this.cur.p.lerpVectors(this.from.p, this.target.p, e);
        this.cur.q.slerpQuaternions(this.from.q, this.target.q, e);
        this.cur.s.lerpVectors(this.from.s, this.target.s, e);
        this.cur.v = lerp(this.from.v, this.target.v, e);
      }
    }
    const o = this.obj;
    o.position.copy(this.cur.p); o.quaternion.copy(this.cur.q); o.scale.copy(this.cur.s);
    if (this.drift && driftWeight > 0) {
      const d = this.drift, w = driftWeight;
      o.position.x += Math.sin(time * d.w + d.ph) * d.a * w;
      o.position.z += Math.cos(time * d.w * 0.83 + d.ph * 1.7) * d.a * w;
      o.rotateY(Math.sin(time * d.w * 0.7 + d.ph) * d.r * w);
    }
    const fade = o.userData.fadeMaterial;
    if (fade) { fade.opacity = this.cur.v * (o.userData.baseOpacity ?? 1); o.visible = this.cur.v > 0.01; }
    else { o.scale.multiplyScalar(Math.max(this.cur.v, 1e-4)); o.visible = this.cur.v > 0.01; }
  }
}

/** A set of Morphables that change state together, staggered by distance from a focus point. */
class MorphGroup {
  constructor(root, focus) { this.root = root; this.focus = focus; this.items = []; this.state = 'neutral'; this.driftWeight = 1; }
  add(item) { this.items.push(item); this.root.add(item.obj); return item; }
  get(id) { return this.items.find((i) => i.id === id); }
  setState(name, duration = 3.0, stagger = 0.8) {
    this.state = name;
    const maxD = Math.max(...this.items.map((i) => i.states.neutral.p.distanceTo(this.focus)), 1);
    for (const it of this.items) it.go(name, duration, stagger * it.states.neutral.p.distanceTo(this.focus) / maxD);
  }
  snap(name) { this.state = name; for (const it of this.items) it.snap(name); }
  update(dt, time) {
    const want = this.state === 'neutral' ? 1 : 0;
    this.driftWeight += (want - this.driftWeight) * Math.min(1, dt * 1.2);
    for (const it of this.items) it.update(dt, this.driftWeight, time);
  }
}

/* =====================================================================
   5. Walking: walkable areas, colliders, the player
   ===================================================================== */
class Walkable {
  constructor() { this.shapes = new Map(); }
  rect(id, x0, x1, z0, z1) { this.shapes.set(id, { kind: 'rect', x0, x1, z0, z1 }); }
  disk(id, cx, cz, r) { this.shapes.set(id, { kind: 'disk', cx, cz, r }); }
  fn(id, test) { this.shapes.set(id, { kind: 'fn', test }); }
  remove(id) { this.shapes.delete(id); }
  contains(x, z, m = 0.3) {
    for (const s of this.shapes.values()) {
      if (s.kind === 'rect' && x >= s.x0 + m && x <= s.x1 - m && z >= s.z0 + m && z <= s.z1 - m) return true;
      if (s.kind === 'disk' && Math.hypot(x - s.cx, z - s.cz) <= s.r - m) return true;
      if (s.kind === 'fn' && s.test(x, z, m)) return true;
    }
    return false;
  }
}

/** Solid objects the player cannot walk through. Footprints follow the objects every frame. */
class Colliders {
  constructor() { this.objects = new Set(); this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3(); this.e = new THREE.Euler(); }
  add(obj) { this.objects.add(obj); }
  remove(obj) { this.objects.delete(obj); }
  static shown(o) { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; }
  resolve(p, radius) {
    for (const o of this.objects) {
      const fp = FOOTPRINT[o.userData.kit];
      if (!fp || !Colliders.shown(o)) continue;
      o.matrixWorld.decompose(this.p, this.q, this.s);
      if (this.p.y > 1.2 || Math.abs(this.s.y) < 0.25) continue;
      const yaw = this.e.setFromQuaternion(this.q, 'YXZ').y, C = Math.cos(yaw), S = Math.sin(yaw);
      const dx = p.x - this.p.x, dz = p.z - this.p.z;
      if (fp[0] === 'circle') {
        const r = fp[1] * Math.max(Math.abs(this.s.x), Math.abs(this.s.z)) + radius, d = Math.hypot(dx, dz);
        if (d < r && d > 1e-6) { p.x = this.p.x + dx / d * r; p.z = this.p.z + dz / d * r; }
        continue;
      }
      // box: into the piece's local frame (three.js Y rotation), push out, back to world
      const lx = dx * C - dz * S, lz = dx * S + dz * C;
      const hx = fp[1] * Math.abs(this.s.x), hz = fp[2] * Math.abs(this.s.z);
      let nlx, nlz;
      if (Math.abs(lx) <= hx && Math.abs(lz) <= hz) {
        if (hx - Math.abs(lx) < hz - Math.abs(lz)) { nlx = (Math.sign(lx) || 1) * (hx + radius); nlz = lz; }
        else { nlx = lx; nlz = (Math.sign(lz) || 1) * (hz + radius); }
      } else {
        const qx = Math.max(-hx, Math.min(hx, lx)), qz = Math.max(-hz, Math.min(hz, lz));
        const ox = lx - qx, oz = lz - qz, d = Math.hypot(ox, oz);
        if (d >= radius) continue;
        nlx = qx + ox / d * radius; nlz = qz + oz / d * radius;
      }
      p.x = this.p.x + nlx * C + nlz * S; p.z = this.p.z - nlx * S + nlz * C;
    }
  }
}

class Player {
  constructor(camera, world) {
    this.camera = camera; this.world = world;
    this.pos = new THREE.Vector3(); this.yaw = 0; this.pitch = 0; this.roll = 0;
    this.moveLock = false; this.lookLock = false; this.speedScale = 1; this.constraint = null; this.auto = null;
    this.eyeY = PLAYER.eye; this.floorY = 0; this.stepAcc = 0; this.extraY = 0;
  }
  place(p, yawDeg = 0) { this.pos.set(p.x, 0, p.z); this.yaw = yawDeg * D2R; this.pitch = 0; this.floorY = this.world.floorAt(p.x, p.z); }
  forward(out = new THREE.Vector3()) { return out.set(-Math.sin(this.yaw) * Math.cos(this.pitch), Math.sin(this.pitch), -Math.cos(this.yaw) * Math.cos(this.pitch)); }
  update(dt, input) {
    if (!this.lookLock) {
      const m = input.takeMouse();
      this.yaw -= m.dx * PLAYER.mouse; this.pitch -= m.dy * PLAYER.mouse;
      const turn = (input.down('ArrowLeft') ? 1 : 0) - (input.down('ArrowRight') ? 1 : 0);
      const tilt = (input.down('ArrowUp') ? 1 : 0) - (input.down('ArrowDown') ? 1 : 0);
      this.yaw += turn * PLAYER.keyTurn * dt; this.pitch += tilt * PLAYER.keyTurn * 0.6 * dt;
      this.pitch = Math.max(-1.35, Math.min(1.35, this.pitch));
    } else input.takeMouse();
    let mx = 0, mz = 0, speed = PLAYER.walk * this.speedScale;
    if (this.auto) {
      const dx = this.auto.target.x - this.pos.x, dz = this.auto.target.z - this.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.05) { this.auto.done = true; this.auto = null; }
      else { const st = Math.min(d, this.auto.speed * dt); mx = dx / d * st; mz = dz / d * st; }
    } else if (!this.moveLock) {
      const f = (input.down('KeyW') ? 1 : 0) - (input.down('KeyS') ? 1 : 0);
      const r = (input.down('KeyD') ? 1 : 0) - (input.down('KeyA') ? 1 : 0);
      const len = Math.hypot(f, r) || 1;
      const sx = -Math.sin(this.yaw), sz = -Math.cos(this.yaw);
      mx = (sx * f + -sz * r) / len * speed * dt; mz = (sz * f + sx * r) / len * speed * dt;
    }
    if (mx || mz) this.#move(mx, mz, !!this.auto);
    const targetFloor = this.world.floorAt(this.pos.x, this.pos.z);
    this.floorY += (targetFloor - this.floorY) * Math.min(1, dt * 10);
    this.camera.position.set(this.pos.x, this.floorY + this.eyeY + this.extraY, this.pos.z);
    this.camera.rotation.set(this.pitch, this.yaw, this.roll, 'YXZ');
  }
  #move(mx, mz, scripted) {
    const before = this.pos.clone();
    const W = this.world.walk, R = PLAYER.radius;
    const nx = this.pos.x + mx, nz = this.pos.z + mz;
    if (scripted || W.contains(nx, nz)) { this.pos.x = nx; this.pos.z = nz; }
    else if (W.contains(nx, this.pos.z)) this.pos.x = nx;
    else if (W.contains(this.pos.x, nz)) this.pos.z = nz;
    if (!scripted) {
      this.world.colliders.resolve(this.pos, R);
      if (!W.contains(this.pos.x, this.pos.z)) this.pos.copy(before);
    }
    if (this.constraint) {
      const c = this.constraint, dx = this.pos.x - c.x, dz = this.pos.z - c.z, d = Math.hypot(dx, dz);
      if (d > c.r) { this.pos.x = c.x + dx / d * c.r; this.pos.z = c.z + dz / d * c.r; }
    }
    const moved = dist2(before, this.pos);
    this.stepAcc += moved;
    if (this.stepAcc > 0.72) { this.stepAcc = 0; this.world.audio.step(this.world.surfaceAt(this.pos.x, this.pos.z)); }
  }
}

class Input {
  constructor(dom) {
    this.keys = new Set(); this.dx = 0; this.dy = 0; this.handlers = [];
    addEventListener('keydown', (e) => { if (e.code === 'Tab') e.preventDefault(); if (!e.repeat) this.handlers.forEach((h) => h('key', e)); this.keys.add(e.code); });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousemove', (e) => { if (document.pointerLockElement === dom) { this.dx += e.movementX; this.dy += e.movementY; } });
    dom.addEventListener('mousedown', (e) => this.handlers.forEach((h) => h('mouse', e)));
    addEventListener('contextmenu', (e) => e.preventDefault());
  }
  on(fn) { this.handlers.push(fn); }
  down(code) { return this.keys.has(code); }
  takeMouse() { const m = { dx: this.dx, dy: this.dy }; this.dx = 0; this.dy = 0; return m; }
}

/* =====================================================================
   6. Screen UI: subtitles, monologue, titles, prompts, tray, vignette
   ===================================================================== */
class ScreenUI {
  constructor(sched) {
    this.sched = sched;
    this.el = (id) => document.getElementById(id);
    this.sub = this.el('sub'); this.mono = this.el('mono'); this.titleEl = this.el('title'); this.promptEl = this.el('prompt');
    this.choicesEl = this.el('choices'); this.fadeEl = this.el('fade'); this.flashEl = this.el('flash');
    this.promptUntil = 0; this.promptText = '';
  }
  async say(who, text) {
    this.sub.querySelector('.who').textContent = who; this.sub.querySelector('.txt').textContent = text;
    this.sub.style.opacity = 1;
    await this.sched.wait(readTime(text));
    this.sub.style.opacity = 0;
    await this.sched.wait(0.35 * FAST);
  }
  async lines(list, onLine) { for (const l of list) { onLine?.(l); await this.say(l[0], l[1]); } }
  /** Inner monologue, one line at a time; stops early when cancelled() becomes true. */
  async monologue(lines, cancelled) {
    for (const line of lines) {
      if (cancelled()) break;
      this.mono.textContent = line; this.mono.style.opacity = 1;
      const t0 = this.sched.time, d = readTime(line);
      await this.sched.until(() => cancelled() || this.sched.time - t0 >= d);
      this.mono.style.opacity = 0;
      const t1 = this.sched.time;
      await this.sched.until(() => cancelled() || this.sched.time - t1 >= 0.7 * FAST);
    }
    this.mono.style.opacity = 0;
  }
  clearMonologue() { this.mono.style.opacity = 0; }
  async title(text, hold = 4) {
    this.titleEl.textContent = text; this.titleEl.classList.add('on');
    await this.sched.wait(1.8 + hold * FAST);
    this.titleEl.classList.remove('on');
    await this.sched.wait(1.8);
  }
  prompt(text, seconds = 0) { this.promptText = text; this.promptEl.textContent = text; this.promptEl.style.opacity = text ? 1 : 0; this.promptUntil = seconds ? this.sched.time + seconds : 0; }
  update() { if (this.promptUntil && this.sched.time > this.promptUntil) this.prompt(''); }
  fade(to, seconds = 1.6) { this.fadeEl.style.transition = `opacity ${seconds}s ease`; this.fadeEl.style.opacity = to; return this.sched.wait(seconds); }
  flash() { this.flashEl.style.opacity = 0.85; setTimeout(() => { this.flashEl.style.opacity = 0; }, 160); }
  vignette(mask) { document.querySelectorAll('#vig .v').forEach((v) => { v.style.opacity = v.dataset.mask === mask ? 1 : 0; }); }
  /** Show options; resolves with the index chosen, or -1 after `timeout` seconds. */
  choose(options, timeout) {
    return new Promise((resolve) => {
      this.choicesEl.innerHTML = ''; this.choicesEl.style.display = 'flex';
      let done = false;
      const finish = (i) => { if (done) return; done = true; this.choicesEl.style.display = 'none'; resolve(i); };
      options.forEach((o, i) => { const b = document.createElement('button'); b.textContent = o; b.onclick = () => finish(i); this.choicesEl.appendChild(b); });
      const keyHandler = (e) => { if (e.code === 'Enter' || e.code === 'KeyE') { removeEventListener('keydown', keyHandler); finish(0); } };
      addEventListener('keydown', keyHandler);
      this.sched.wait(timeout).then(() => { removeEventListener('keydown', keyHandler); finish(-1); });
    });
  }
}

/** The three masks in the tray, and the rules for wearing them (design doc §3). */
class MaskSystem {
  constructor(world) {
    this.w = world; this.owned = false; this.current = null; this.memory = null; this.busyUntil = 0; this.picking = false; this.signature = '';
    this.tray = document.getElementById('tray');
    this.slots = {};
    MASK_IDS.forEach((id, i) => {
      const s = document.createElement('div'); s.className = 'slot'; s.dataset.mask = id;
      s.innerHTML = `<span class="key">${i + 1}</span><img src="${window.DG_ASSETS?.['icon_' + id] || ''}"><span class="tick">✓</span><span class="name">${MASK_LABEL[id]}</span>`;
      s.addEventListener('mousedown', (e) => { e.stopPropagation(); if (e.button === 0) { this.wear(id); this.setPicking(false); } });
      this.tray.appendChild(s); this.slots[id] = s;
    });
    document.querySelectorAll('#vig .v').forEach((v) => { v.style.backgroundImage = `url(${window.DG_ASSETS?.['vignette_' + v.dataset.mask] || ''})`; });
  }
  setMemory(mem) { this.memory = mem; this.refresh(true); }
  reveal(seconds) { this.revealUntil = this.w.sched.time + seconds; }
  inMemory() { const m = this.memory; return !!(m && m.enabled && !m.complete && m.contains(this.w.player.pos)); }
  canWear() { return this.owned && this.inMemory() && this.w.sched.time >= this.busyUntil; }
  wear(id) {
    if (!this.owned) return;
    if (!this.inMemory()) { this.w.ui.prompt(this.memory?.enabled ? 'Masks can only be worn inside the circle of light.' : 'Masks can only be worn inside a memory.', 2.5); return; }
    if (this.current === id || this.w.sched.time < this.busyUntil) return;
    this.busyUntil = this.w.sched.time + 0.9;
    this.current = id;
    this.w.ui.flash(); this.w.ui.vignette(id); this.w.audio.motif(id);
    const m = this.memory;
    this.w.player.constraint = { x: m.centre.x, z: m.centre.z, r: m.radius - PLAYER.radius };
    m.wear(id);
    this.refresh(true);
  }
  remove() {
    if (!this.current) return;
    this.current = null; this.w.ui.vignette(null); this.w.player.constraint = null;
    this.memory?.remove();
    this.refresh(true);
  }
  setPicking(on) {
    this.picking = on && this.owned;
    this.tray.classList.toggle('picking', this.picking);
    if (this.picking) { document.exitPointerLock?.(); if (!this.inMemory()) this.wear(null); }
    else this.w.lockPointer();
  }
  refresh(force = false) {
    const show = this.owned && (this.picking || !!this.memory?.enabled || this.w.sched.time < (this.revealUntil || 0));
    const sig = [show, this.picking, this.current, this.inMemory(), [...(this.memory?.seen || [])].join(), this.memory?.complete].join('|');
    if (!force && sig === this.signature) return;
    this.signature = sig;
    this.tray.classList.toggle('show', show);
    for (const id of MASK_IDS) {
      const s = this.slots[id], seen = !!this.memory?.seen.has(id);
      s.classList.toggle('disabled', !this.inMemory() && this.current !== id);
      s.classList.toggle('worn', this.current === id);
      s.classList.toggle('seen', !!this.memory?.enabled && seen);
      s.classList.toggle('unseen', !!this.memory?.enabled && !seen && !this.memory?.complete);
    }
  }
  dropAll() {   // Act 3: the masks fall out of the tray
    this.remove(); this.owned = false;
    Object.values(this.slots).forEach((s, i) => { s.style.setProperty('--rot', `${(i - 1) * 40 + 15}deg`); setTimeout(() => s.classList.add('falling'), i * 260); });
    setTimeout(() => this.tray.classList.remove('show'), 2400);
  }
}

/**
 * A memory scene (Act 1, Act 2): the circle of light, the three mask states, and the
 * "seen" bookkeeping. The act supplies the morph group, palettes, monologues and effects.
 */
class Memory {
  constructor(world, { centre, radius, morph, palettes, monologues, effects = {}, onComplete }) {
    Object.assign(this, { w: world, centre, radius, morph, palettes, monologues, effects, onComplete });
    this.enabled = false; this.complete = false; this.seen = new Set(); this.token = 0; this.current = null;
    this.ring = this.#makeRing(); world.scene.add(this.ring);
  }
  #makeRing() {
    const g = new THREE.RingGeometry(this.radius - 0.08, this.radius, 96); g.rotateX(-Math.PI / 2);
    const m = new THREE.MeshBasicMaterial({ color: 0xfff4dc, transparent: true, opacity: 0, depthWrite: false });
    const ring = new THREE.Mesh(g, m); ring.position.set(this.centre.x, this.centre.y + 0.02, this.centre.z);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(this.radius, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfff4dc, transparent: true, opacity: 0, depthWrite: false }));
    disc.position.y = -0.005; ring.add(disc); ring.userData.disc = disc;
    return ring;
  }
  contains(p) { return Math.hypot(p.x - this.centre.x, p.z - this.centre.z) <= this.radius; }
  enable() { this.enabled = true; }
  async wear(mask) {
    const tok = ++this.token; this.current = mask;
    this.morph.setState(mask, 3.0);
    this.w.atmo.to(this.palettes[mask], 2.6);
    this.effects.wear?.(mask);
    this.w.audio.rumble(3);
    await this.w.sched.wait(3.2);
    if (tok !== this.token) return;
    await this.w.ui.monologue(this.monologues[mask], () => tok !== this.token);
    if (tok !== this.token) return;
    this.seen.add(mask);
    this.w.masks.refresh(true);
  }
  remove() {
    ++this.token; this.current = null;
    this.w.ui.clearMonologue();
    this.morph.setState('neutral', 2.4);
    this.w.atmo.to(this.palettes.neutral, 2.0);
    this.effects.remove?.();
    this.w.audio.rumble(2.4);
    if (this.seen.size === MASK_IDS.length && !this.complete) { this.complete = true; this.onComplete?.(); }
  }
  update(dt, time) {
    const lit = this.enabled && !this.complete;
    const m = this.ring.material, d = this.ring.userData.disc.material;
    const pulse = 0.55 + 0.25 * Math.sin(time * 2.2);
    m.opacity += ((lit ? pulse : 0) - m.opacity) * Math.min(1, dt * 3);
    d.opacity += ((lit ? 0.07 : 0) - d.opacity) * Math.min(1, dt * 3);
    if (!lit) return;
    const ui = this.w.ui, inside = this.contains(this.w.player.pos), masks = this.w.masks;
    let hint = '';
    if (!inside) hint = 'Walk into the circle of light.';
    else if (!masks.current) hint = this.seen.size === 0 ? 'Press Tab to choose a mask  (or 1 / 2 / 3)' : (this.seen.size < 3 ? 'Choose another mask  (Tab)' : '');
    else if (this.seen.size === 3) hint = 'Right-click to take off the mask.';
    if (!ui.promptUntil && ui.promptText !== hint) ui.prompt(hint);
  }
}

/* =====================================================================
   7. Sound (synthesised, no files)
   ===================================================================== */
class Sound {
  constructor() { this.ctx = null; this.master = null; this.musicTimer = null; }
  start() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    this.master = this.ctx.createGain(); this.master.gain.value = 0.6; this.master.connect(this.ctx.destination);
    const dl = this.ctx.createDelay(1.0); dl.delayTime.value = 0.32; const fb = this.ctx.createGain(); fb.gain.value = 0.35;
    dl.connect(fb); fb.connect(dl); dl.connect(this.master); this.echo = dl;
    this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  #noise(dur, { f = 1000, q = 1, type = 'bandpass', gain = 0.3, attack = 0.002, echo = false } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const flt = c.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(this.master); if (echo) g.connect(this.echo);
    s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  #tone(freq, dur, { type = 'sine', gain = 0.12, when = 0 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  }
  step(surface) {
    if (surface === 'masks') { this.#noise(0.35, { f: 2600 + Math.random() * 1600, q: 8, gain: 0.25, echo: true }); this.#noise(0.18, { f: 900, q: 3, gain: 0.12, echo: true }); }
    else this.#noise(0.09, { f: 1800, q: 1.2, gain: 0.07 });
  }
  rumble(dur) { this.#noise(dur, { f: 90, q: 0.7, type: 'lowpass', gain: 0.35, attack: 0.4 }); }
  motif(mask) {
    const base = 293.66; // D
    const iv = { don: [0, 4, 7, 12], anna: [0, 3, 7, 3], servant: [0, 3, 6, 9] }[mask] || [0];
    iv.forEach((s, i) => this.#tone(base * Math.pow(2, s / 12), 0.9, { type: 'triangle', gain: 0.07, when: i * 0.16 }));
  }
  sting() { [0, 1, 6].forEach((s, i) => this.#tone(73.42 * Math.pow(2, s / 12), 4, { type: 'sawtooth', gain: 0.05, when: i * 0.05 })); }
  crack() { this.#noise(0.6, { f: 3500, q: 2, gain: 0.4 }); this.#noise(1.2, { f: 200, q: 0.8, gain: 0.3, type: 'lowpass' }); }
  fire(dur) { this.#noise(dur, { f: 400, q: 0.4, type: 'lowpass', gain: 0.5, attack: 2 }); }
  /** A simple 3/4 pulse in D minor for the stage (stand-in for the opera recording). */
  music(on) {
    if (!this.ctx) return;
    clearInterval(this.musicTimer); if (!on) return;
    const bass = [146.83, 146.83, 110, 130.81, 116.54, 110], chords = [[293.66, 349.23, 440], [277.18, 329.63, 440], [293.66, 349.23, 466.16]];
    let beat = 0;
    this.musicTimer = setInterval(() => {
      const bar = Math.floor(beat / 3) % bass.length;
      if (beat % 3 === 0) this.#tone(bass[bar], 0.9, { type: 'triangle', gain: 0.11 });
      else chords[bar % chords.length].forEach((f) => this.#tone(f, 0.25, { type: 'sine', gain: 0.035 }));
      if (this.onBeat) this.onBeat(beat);
      beat++;
    }, 460);
  }
}

/* =====================================================================
   8. The eyes of the giant shadow
   ===================================================================== */
class Watcher {
  constructor(scene) {
    const tex = canvasTexture(64, 64, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(220,235,255,.8)'); gr.addColorStop(1, 'rgba(200,220,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    this.mat = new THREE.SpriteMaterial({ map: tex, color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, fog: false });
    this.eyes = [new THREE.Sprite(this.mat), new THREE.Sprite(this.mat)];
    this.eyes.forEach((e) => scene.add(e));
    this.targetOpacity = 0;
  }
  place(a, b, size) { this.eyes[0].position.copy(a); this.eyes[1].position.copy(b); this.eyes.forEach((e) => e.scale.set(size, size, 1)); }
  show(on) { this.targetOpacity = on ? 1 : 0; }
  update(dt, time) { this.mat.opacity += (this.targetOpacity * (0.85 + 0.15 * Math.sin(time * 1.3)) - this.mat.opacity) * Math.min(1, dt * 1.5); }
}

/* =====================================================================
   9. Scenes
   ===================================================================== */
function addFloor(world, id, x, z, sx, sz, top = 0, thickness = 0.4) {
  const m = new THREE.Mesh(KIT.Block, floorMaterial(sx, sz));
  m.scale.set(sx, thickness, sz); m.position.set(x, top - thickness, z);
  m.userData = { kit: 'Block', category: 'floor', size: [sx, thickness, sz], id };
  world.scene.add(m); world.statics.push({ id, obj: m });

/** Liquid wobble for the masks on the table (vertex displacement in view space, metres). */
function wobbleMaterial(src, _shared, time) {
  const mat = src.clone();
  const wob = { value: 0.006 };
  mat.userData.wobble = wob;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uWobble = wob; shader.uniforms.uTime = time;
    shader.vertexShader = 'uniform float uWobble; uniform float uTime;\n' + shader.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 wpW = modelMatrix * vec4(transformed, 1.0);
      vec3 nW = normalize(normalMatrix * objectNormal);
      mvPosition.xyz += nW * uWobble * (sin(wpW.x * 60.0 + uTime * 2.3) * sin(wpW.z * 55.0 + uTime * 1.7) + 0.6 * sin(wpW.y * 70.0 + uTime * 3.1));
      gl_Position = projectionMatrix * mvPosition;`);
  };
  return mat;
}

/* ---------- Act 3: the place of judgement, and the ending ---------- */
class Act3 {
  constructor(w) {
    this.w = w;
    this.z0 = -126; this.z1 = -190; this.zGlass = ANCHOR.glass.z;
    this.width = (z) => lerp(14, 2.4, clamp01((this.z0 - z) / (this.z0 - this.z1)));
    w.walk.fn('act3', (x, z, m) => z <= this.z0 + 1.5 && z >= this.zGlass + 2.6 && Math.abs(x) <= this.width(z) / 2 - 0.6 - m * 0.2);
    this.#floor(); this.#walls(); this.#masksOnFloor(); this.#glass();
    this.ended = false;
  }
  #floor() {
    const g = new THREE.BufferGeometry(), segs = 40, pos = [], uv = [], idx = [];

      const z = lerp(this.z0 + 1, this.zGlass - 1, i / segs), hw = this.width(z) / 2 + 0.8;
      pos.push(-hw, 0, z, hw, 0, z); uv.push(-hw / 6, z / 6, hw / 6, z / 6);
      if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    const mat = floorMaterial(6, 6); mat.map.repeat.set(1, 1);
    const m = new THREE.Mesh(g, mat); m.userData = { kit: 'Act3Floor', id: 'act3_floor' }; this.w.scene.add(m); this.w.statics.push({ id: 'act3_floor', obj: m });
  }
  #walls() {
    const rnd = seeded(41); this.walls = [];
    const kits = [['TriSlab', 'slab'], ['Spike', 'slab'], ['TriPrism', 'prism'], ['Block', 'block']];
    for (let z = this.z0 + 2; z > this.zGlass - 4; z -= 2.6) {
      const t = clamp01((this.z0 - z) / (this.z0 - this.z1)), h = lerp(7, 20, t);
      for (const side of [-1, 1]) {
        const [kit, cat] = kits[Math.floor(rnd() * kits.length)];
        const size = kit === 'TriSlab' ? [3.2, h, 0.5] : kit === 'Block' ? [2.2, h * 0.8, 2.2] : [2.2, h, 2.2];
        const m = makePiece(kit, cat, size);
        m.position.set(side * (this.width(z) / 2 + 1.2), 0, z); m.rotation.y = kit === 'TriSlab' ? side * 90 * D2R : rnd() * 3;
        m.userData.id = `A3_wall_${this.walls.length}`; this.w.scene.add(m); this.walls.push(m); this.w.statics.push({ id: m.userData.id, obj: m });
      }
    }
  }
  #masksOnFloor() {

    for (let i = 0; i < n; i++) {
      const z = lerp(this.z0 + 0.5, this.zGlass + 0.5, Math.pow(rnd(), 0.9)), hw = this.width(z) / 2 - 0.2;
      const x = (rnd() * 2 - 1) * hw * (0.35 + 0.65 * rnd());

  }
  #glass() {
    const G = ANCHOR.glass;

    const crackTex = canvasTexture(1024, 2048, (g, W, H) => drawCracks(g, W, H, seeded(9), { centres: [[0.38, 0.92], [0.62, 0.92]], color: 'rgba(255,255,255,.8)', count: 8, len: 0.32, width: 0.45 }));
    this.cracks = new THREE.Mesh(new THREE.PlaneGeometry(8, 20), new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, opacity: 0, depthWrite: false }));

  }
  placePlayer() { this.w.player.place(v3(0, 0, -121), 0); }
  surfaceAt(z) { return z < this.z0 + 1 ? 'masks' : 'marble'; }
  async run({ jumpToEnd = false } = {}) {
    const { w } = this;

      await w.sched.until(() => w.player.pos.z < this.z0 - 1);

  dropMasks() {

    const models = w.maskModels; if (!models) return;
    MASK_IDS.forEach((id, i) => {
      const m = models[id].clone(true); w.scene.add(m);
      const p = w.camera.position.clone().add(w.player.forward().multiplyScalar(0.7)); p.x += (i - 1) * 0.25; p.y -= 0.2;
      m.position.copy(p); const vy = { v: 0.4 }; const spin = v3(Math.random() * 4, Math.random() * 4, Math.random() * 4);
      const fall = (dt) => { if (m.position.y > 0.08) { vy.v -= 9.8 * dt; m.position.y = Math.max(0.08, m.position.y + vy.v * dt); m.rotation.x += spin.x * dt; m.rotation.y += spin.y * dt; } else { m.rotation.x += (-Math.PI / 2 - m.rotation.x) * Math.min(1, dt * 6); } };
      w.onFrame.push(fall);
      setTimeout(() => w.audio.step('masks'), 600 + i * 120);
    });
  }
  update(dt) {
    const p = this.w.player;
    if (p.pos.z < this.z0 && !this.ended) {
      const t = clamp01((this.z0 - p.pos.z) / (this.z0 - this.zGlass));
      this.w.atmo.mix('neutral', 'judgement', t);
      const d = p.pos.z - this.zGlass;
      p.speedScale = d < 13 ? lerp(0.43, 1, clamp01((d - 3) / 10)) : 1;
    } else if (!this.ended) p.speedScale = 1;
  }
  async #ending() {
    const { w } = this; const { player, ui, sched, tweens, audio } = w;
    this.ended = true; player.moveLock = true; player.speedScale = 1;
    await sched.wait(1.2);
    await ui.lines(SCRIPT.act3Question);
    document.exitPointerLock?.();
    const pick = await ui.choose([SCRIPT.act3Answer], 15);
    if (pick === 0) await ui.say('', SCRIPT.act3Answer);
    await sched.wait(pick === 0 ? 1 : 3);
    // the mist clears: it is the Commendatore
    player.lookLock = true; const pitch0 = player.pitch, yaw0 = player.yaw;
    await tweens.run(3.5, (k) => { this.mist.material.opacity = 0.88 * (1 - k) + 0.12 * k; this.giant.material.opacity = 1 - k; this.statue.material.opacity = k; player.pitch = lerp(pitch0, 0.62, k); player.yaw = lerp(yaw0, 0, k); });
    await ui.lines(SCRIPT.act3Reply);
    audio.crack();
    await tweens.run(2.5, (k) => { this.cracks.material.opacity = k; this.handsGlass.forEach((h) => { h.mesh.position.z = ANCHOR.glass.z - 0.06 + k * 0.03; }); });
    audio.rumble(5);

    w.atmo.to('inferno', 6);
    tweens.run(5, (k) => {
      this.walls.forEach((m, i) => { const s = start[i]; m.rotation.z = s.r.z - s.dir * k * (0.4 + (i % 5) * 0.12); m.position.y = s.p.y - k * k * 6; });
      player.roll = Math.sin(k * 6) * 0.08 * (1 - k); this.glass.position.y = 10 - k * 2;
    });
    await sched.wait(3);
    // the cross
    player.pitch = 0; player.lookLock = true;
    document.getElementById('arms').style.opacity = 1;
    await ui.lines(SCRIPT.act3Cry);
    document.getElementById('fire').classList.add('on'); audio.fire(8);
    await tweens.run(6, (k) => { player.extraY = -k * 2.2; });
    await ui.fade(1, 2.5);
    document.getElementById('fire').classList.remove('on'); document.getElementById('arms').style.opacity = 0;

  }
  skipToEnd() { this.dropMasks(); this.w.watcher.place(this.eyePos[0], this.eyePos[1], 0.7); this.w.watcher.show(true); this.w.player.place(v3(0, 0, this.zGlass + 3.05), 0); this.w.atmo.set('judgement'); }
}

/** ~200-triangle mask shell for the thousands of masks on the floor of Act 3. */
function lowMaskGeometry() {
  const nu = 12, nv = 14, pos = [], idx = [], id = (i, j) => j * (nu + 1) + i, inside = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const u = (i / nu) * 2 - 1, v = (j / nv) * 2 - 1;
    pos.push(0.085 * u, 0.105 * v, 0.045 * (1 - u * u) * (1 - 0.35 * v * v));
    inside.push(u * u + v * v <= 1.02);
  }
  const eye = (u, v) => ((Math.abs(u) - 0.42) ** 2) / 0.05 + ((v - 0.22) ** 2) / 0.012 < 1;
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = id(i, j), b = id(i + 1, j), c = id(i, j + 1), d = id(i + 1, j + 1);
    const u = ((i + 0.5) / nu) * 2 - 1, v = ((j + 0.5) / nv) * 2 - 1;
    if (![a, b, c, d].every((k) => inside[k]) || eye(u, v)) continue;
    idx.push(a, b, d, a, d, c);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* =====================================================================
   10. Export: layout.json for UE (and the kit meshes)
   ===================================================================== */
/** three.js (metres, +y up, -z north) → UE (centimetres, Z up) assuming UE's glTF import maps (x, y, z) → (x, z, y). Verify with axis_marker.glb first (see docs/ue-handoff). */
function toUE(pos, quat, scale) {
  const q = { x: -quat.x, y: -quat.z, z: -quat.y, w: quat.w };
  return { location_cm: [pos.x * 100, pos.z * 100, pos.y * 100].map(round), quat_xyzw: [q.x, q.y, q.z, q.w].map(round6), rotator_pyr: quatToRotator(q).map(round), scale: [scale.x, scale.z, scale.y].map(round6) };
}
const round = (x) => Math.round(x * 100) / 100, round6 = (x) => Math.round(x * 1e6) / 1e6;
/** Same maths as UE's FQuat::Rotator(). Returns [Pitch, Yaw, Roll] in degrees. */
function quatToRotator(q) {
  const { x: X, y: Y, z: Z, w: W } = q, R2D = 180 / Math.PI;
  const sing = Z * X - W * Y, yawY = 2 * (W * Z + X * Y), yawX = 1 - 2 * (Y * Y + Z * Z);
  const yaw = Math.atan2(yawY, yawX) * R2D;
  if (sing < -0.4999995) return [-90, yaw, normAxis(-yaw - 2 * Math.atan2(X, W) * R2D)];
  if (sing > 0.4999995) return [90, yaw, normAxis(yaw - 2 * Math.atan2(X, W) * R2D)];
  return [Math.asin(2 * sing) * R2D, yaw, Math.atan2(-2 * (W * X + Y * Z), 1 - 2 * (X * X + Y * Y)) * R2D];
}
function normAxis(a) { a %= 360; if (a > 180) a -= 360; if (a < -180) a += 360; return a; }

function describe(obj, parentMatrix) {
  const m = new THREE.Matrix4().multiplyMatrices(parentMatrix, obj.matrix);
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); m.decompose(p, q, s);
  return { three: { pos: p.toArray().map(round6), quat_xyzw: q.toArray().map(round6), scale: s.toArray().map(round6) }, ue: toUE(p, q, s) };
}

function exportLayout(world) {
  const acts = {};
  const morphExport = (group, rootObj, stateNames) => group.items.map((it) => {
    const out = { id: it.id, kit: it.obj.userData.kit, category: it.obj.userData.category || (it.obj.userData.spin ? 'prism' : null), pose: it.obj.userData.pose || null, states: {} };
    const mul = it.obj.userData.spin ? v3(...it.obj.userData.size) : v3(1, 1, 1);
    const rootM = new THREE.Matrix4().compose(rootObj.position, new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
    for (const name of stateNames) {
      if (!it.states[name] && name !== 'neutral') continue;
      const st = it.stateFor(name), tmp = new THREE.Object3D();
      tmp.position.copy(st.p); tmp.quaternion.copy(st.q); tmp.scale.copy(st.s).multiply(mul); tmp.updateMatrix();
      out.states[name] = { ...describe(tmp, rootM), visible: round(st.v) };
    }
    return out;
  });
  const a1 = world.acts.act1, a2 = world.acts.act2, s1 = world.acts.shadow, a3 = world.acts.act3;
  acts.act1 = { anchor_three: ANCHOR.c1.toArray(), memory_circle: { centre_three: a1.memory.centre.toArray(), centre_ue_cm: toUE(a1.memory.centre, new THREE.Quaternion(), v3(1, 1, 1)).location_cm, radius_m: a1.memory.radius }, pieces: morphExport(a1.morph, a1.root, ['neutral', 'don', 'anna', 'servant', 'open']) };
  acts.act2 = { anchor_three: ANCHOR.c2.toArray(), memory_circle: { centre_three: a2.memory.centre.toArray(), centre_ue_cm: toUE(a2.memory.centre, new THREE.Quaternion(), v3(1, 1, 1)).location_cm, radius_m: a2.memory.radius }, pieces: morphExport(a2.morph, a2.root, ['hidden', 'neutral', 'don', 'anna', 'servant', 'open']), note: 'Prisms carry three painted faces each (child planes); during the opening they orbit the centre once (12.5 s) and spin three turns.' };
  const ident = new THREE.Matrix4();
  acts.shadow1 = { viewpoint_eye_three: s1.eye.toArray(), viewpoint_eye_ue_cm: toUE(s1.eye, new THREE.Quaternion(), v3(1, 1, 1)).location_cm, look_dir_three: s1.dir.toArray().map(round6), tolerance: { distance_m: 1.3, angle_deg: 11 }, texture: 'silhouettes/bust.png', shards: s1.shards.map((m) => { m.updateMatrix(); return { id: m.userData.id, uv_rect: m.userData.uv.map(round6), size_m: m.userData.size.map(round6), ...describe(m, ident) }; }), eyes_three: s1.eyePos.map((p) => p.toArray().map(round6)) };
  acts.act3 = { corridor: { z_start: a3.z0, z_narrow: a3.z1, width_start_m: 14, width_end_m: 2.4, glass_z: a3.zGlass, stop_distance_m: 3 }, walls: a3.walls.map((m) => { m.updateMatrix(); return { id: m.userData.id, kit: m.userData.kit, category: m.userData.category, ...describe(m, ident) }; }), floor_masks: a3.floorMasks.userData.count, eyes_three: a3.eyePos.map((p) => p.toArray()) };
  const statics = world.statics.filter((s) => s.obj.userData.kit === 'Block' || s.obj.userData.kit === 'Drum').map((s) => { s.obj.updateMatrixWorld(true); const parent = s.obj.parent?.matrixWorld || ident; return { id: s.id, kit: s.obj.userData.kit, category: s.obj.userData.category, ...describe(s.obj, parent) }; });
  return {
    version: '0.1',
    generated_by: 'prototype/index.html',
    conventions: {
      three: 'metres; +x east, +y up, -z north (the player walks towards -z); right-handed',
      ue: 'centimetres; UE = (x, z, y) * 100 i.e. X = east, Y = south, Z = up. quat = (-qx, -qz, -qy, qw). Assumes the UE glTF importer maps glTF (x, y, z) to UE (x, z, y); check with axis_marker.glb before trusting it.',
      kit: 'unit meshes in kit/*.glb, pivot at the centre of the base; scale = size in metres [x, y, z] in three.js terms',
      states: 'neutral (no mask), don, anna, servant, plus act-specific: hidden, open. visible 0..1 (0 = hidden; silhouettes fade by opacity, solids by scale)',
    },
    anchors_three: Object.fromEntries(Object.entries(ANCHOR).map(([k, v]) => [k, v.toArray()])),
    player: PLAYER,
    palettes: PALETTE,
    timings: { mask_morph_s: 3.0, mask_morph_stagger_s: 0.8, remove_morph_s: 2.4, palette_s: 2.6, wear_lockout_s: 0.9 },
    statics, acts,
  };
}

async function exportKit() {
  const exporter = new GLTFExporter(), out = {};
  for (const name of ['TriSlab', 'Spike', 'TriPrism', 'Block', 'Orb', 'Drum', 'Cone', 'Plane']) {
    // hard edges for the faceted pieces, as the greybox shades them flat
    let geo = KIT[name];
    if (['TriSlab', 'Spike', 'TriPrism'].includes(name)) { geo = geo.toNonIndexed(); geo.computeVertexNormals(); }
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x808080 })); mesh.name = `DG_${name}`;
    out[name] = await exporter.parseAsync(mesh, { binary: true });
  }
  // axis marker: +x arm 1.0 m, +y arm 0.6 m, +z arm 0.3 m (each a thin box ending at that distance)
  const g = new THREE.Group(); g.name = 'DG_AxisMarker';
  for (const [len, axis] of [[1, 'x'], [0.6, 'y'], [0.3, 'z']]) {
    const s = { x: [len, 0.04, 0.04], y: [0.04, len, 0.04], z: [0.04, 0.04, len] }[axis];
    const b = new THREE.Mesh(new THREE.BoxGeometry(...s), new THREE.MeshStandardMaterial({ color: 0xffffff })); b.name = `arm_${axis}`;
    b.position[axis] = len / 2; g.add(b);
  }
  out.AxisMarker = await exporter.parseAsync(g, { binary: true });
  const poses = {};
  for (const p of [...Object.keys(POSE_SPECS), 'bust', 'hand']) poses[p] = poseTexture(p).userData.canvas.toDataURL('image/png');
  poses.marble = marbleTex.userData.canvas.toDataURL('image/png');
  return { glb: out, poses };
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(); scene.fog = new THREE.Fog(0x000000, 10, 60);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.03, 600); scene.add(camera);
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1); scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5); keyLight.position.set(-30, 60, 25); keyLight.target.position.set(0, 0, -60); scene.add(keyLight, keyLight.target);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const sched = new Scheduler();
const world = {
  scene, camera, renderer, sched, tweens: new Tweens(), atmo: new Atmosphere(scene, hemi, keyLight),
  walk: new Walkable(), colliders: new Colliders(), statics: [], onFrame: [], interact: null, audio: new Sound(),
  floorAt: (x, z) => (Math.hypot(x - ANCHOR.c2.x, z - ANCHOR.c2.z) <= 12 ? 0.3 : 0),

function drawArms(c) {   // outstretched arms bound to a beam, seen from inside
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.fillStyle = '#0b0705';
  g.fillRect(0, H * 0.3, W * 0.2, H * 0.09); g.fillRect(W * 0.8, H * 0.3, W * 0.2, H * 0.09);
  g.beginPath(); g.moveTo(0, H * 0.4); g.quadraticCurveTo(W * 0.12, H * 0.38, W * 0.18, H * 0.44); g.lineTo(W * 0.16, H * 0.52); g.quadraticCurveTo(W * 0.08, H * 0.49, 0, H * 0.53); g.fill();
  g.beginPath(); g.moveTo(W, H * 0.4); g.quadraticCurveTo(W * 0.88, H * 0.38, W * 0.82, H * 0.44); g.lineTo(W * 0.84, H * 0.52); g.quadraticCurveTo(W * 0.92, H * 0.49, W, H * 0.53); g.fill();
  g.strokeStyle = '#2a1a12'; g.lineWidth = 7; for (const x of [W * 0.12, W * 0.88]) { g.beginPath(); g.moveTo(x - 30, H * 0.36); g.lineTo(x + 30, H * 0.5); g.stroke(); }
}

async function loadMasks() {
  const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
  const models = {};
  for (const id of MASK_IDS) {
    const url = window.DG_ASSETS?.['mask_' + id]; if (!url) continue;
    const buf = await (await fetch(url)).arrayBuffer();
    const gltf = await loader.parseAsync(buf, '');
    const root = gltf.scene; const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
    const holder = new THREE.Group(); root.position.sub(c); holder.add(root);
    models[id] = holder;
  }
  return models;
}

const PARTS = ['opening', 'act1', 'shadow', 'act2', 'act3'];
let running = false, paused = false;
async function play(startAt) {
  running = true;
  const A = world.acts;
  const at = startAt === 'ending' ? 'act3' : startAt;
  const idx = Math.max(0, PARTS.indexOf(at));
  for (let i = 0; i < idx; i++) A[PARTS[i]].skip();
  if (idx > 0) { world.atmo.set('neutral'); A[PARTS[idx]].placePlayer(); world.ui.fade(0, 1.2); }
  for (let i = idx; i < PARTS.length; i++) {
    if (PARTS[i] === 'act3' && startAt === 'ending') { A.act3.skipToEnd(); await A.act3.run({ jumpToEnd: true }); }
    else await A[PARTS[i]].run();
  }
  running = false;
  document.getElementById('menu').classList.remove('hidden'); document.exitPointerLock?.();
  document.querySelector('#menu h2').textContent = 'THANK YOU FOR PLAYING THE GREYBOX';
}

const input = new Input(renderer.domElement);
input.on((type, e) => {
  if (!running) return;
  if (type === 'key') {
    if (e.code === 'Tab') world.masks.setPicking(!world.masks.picking);
    else if (MASK_KEY[e.code]) world.masks.wear(MASK_KEY[e.code]);
    else if (e.code === 'KeyE') world.interact?.();
    else if (e.code === 'Backquote') toggleDebug();
  } else if (type === 'mouse') {
    if (e.button === 2) world.masks.remove();
    else if (e.button === 0 && !world.masks.picking && document.pointerLockElement !== renderer.domElement) world.lockPointer();
  }
});
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  document.getElementById('crosshair').classList.toggle('hidden', !locked);
  if (!locked && running && !world.masks.picking && document.getElementById('choices').style.display !== 'flex' && !world.acts.act3.ended) { paused = true; document.getElementById('pause').classList.remove('hidden'); }
});
document.querySelectorAll('.screen button').forEach((b) => b.addEventListener('click', () => {
  const act = b.dataset.act;
  if (act === 'start') { document.getElementById('menu').classList.add('hidden'); world.audio.start(); world.lockPointer(); if (!running) play(START_AT); }
  if (act === 'continue') { paused = false; document.getElementById('pause').classList.add('hidden'); world.lockPointer(); }
  if (act === 'quit') location.href = location.pathname;
}));

function toggleDebug() {
  const d = document.getElementById('debug'); d.classList.toggle('hidden');
  if (!d.classList.contains('hidden') && !d.dataset.built) {
    d.dataset.built = 1;
    d.innerHTML = `<div>jump: ${['opening', 'act1', 'shadow', 'act2', 'act3', 'ending'].map((a) => `<button data-at="${a}">${a}</button>`).join('')}</div><div><button id="dbgExport">download layout.json</button></div><div id="dbgPos"></div>`;
    d.querySelectorAll('[data-at]').forEach((b) => { b.onclick = () => { location.search = `?at=${b.dataset.at}`; }; });
    d.querySelector('#dbgExport').onclick = () => { const blob = new Blob([JSON.stringify(exportLayout(world), null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'layout.json'; a.click(); };
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(DT_MAX, (now - last) / 1000); last = now;
  if (!paused) {
    sched.tick(dt); world.tweens.update(dt); world.atmo.update(dt);
    world.player.update(dt, input);
    for (const a of Object.values(world.acts)) a.update(dt, sched.time);
    world.watcher.update(dt, sched.time); world.masks.refresh(); world.ui.update();
    for (const f of world.onFrame) f(dt);
    const dbg = document.getElementById('dbgPos'); if (dbg && !document.getElementById('debug').classList.contains('hidden')) dbg.textContent = `pos ${world.player.pos.x.toFixed(2)}, ${world.player.pos.z.toFixed(2)}  yaw ${(world.player.yaw / D2R).toFixed(0)}°`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// boot
world.player.place(ANCHOR.start, 0);
loadMasks().then((models) => {
  world.maskModels = models; world.acts.opening.attachMasks(models);
}).catch((e) => console.warn('masks not loaded', e)).finally(() => {
  document.getElementById('loading').classList.add('hidden');
  if (AUTOSTART) { world.audio.start(); play(START_AT); } else document.getElementById('menu').classList.remove('hidden');
});
requestAnimationFrame(frame);

// test / tooling hooks
window.DG = { world, exportLayout: () => exportLayout(world), exportKit, play, SCRIPT, ANCHOR };
</script>
</body>
</html>
